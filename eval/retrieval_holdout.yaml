# RAG #3 개선 뒤 확인용 새 보류 검증 질문 (R3 작성, 2026-10-23)
#
# 규칙: 개선(범위 판정 · 실시간 구분 · 가격 표현)을 마친 뒤, 실행하기 전에 커밋해 고정한다. 결과를 보고 질문을 고치지 않는다.
# R3 44문항(eval/retrieval.yaml) · R6 32문항(oneload-qa eval/retrieval_cases.json)과 주제 · 표현이 겹치지 않게 썼다.
# gold: 이 중 하나라도 상위 3개 안에 있으면 정답. [] 이면 아무 문서도 나오지 않아야 정답.
# 한계: R3가 쓴 질문이라 완전히 독립된 검증은 아니다. R6 의 새 보류 검증셋으로 다시 확인해야 한다.

