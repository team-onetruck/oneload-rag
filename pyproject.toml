[project]
name = "hangil-rag"
version = "0.3.0"
description = "Hangil (한길) R3 RAG: knowledge documents, chunking, loading and search behind the agent's search_knowledge tool"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pgvector = ["psycopg[binary]>=3.3"]
openai = ["openai>=1.60"]
mcp = ["mcp>=2.3,<3"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hangil_rag"]

# Documents travel inside the wheel, so `pip install git+...@<tag>` ships the knowledge of that tag.
[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "hangil_rag/knowledge"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["oneload_agent", "oneload-backend", "oneload-data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
